<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>สั่งซื้อสินค้า | Aura Strand</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .order-box .btn { margin-top: var(--space-2); }
    .field textarea { resize: vertical; min-height: 110px; }
    .order-hint { text-align: center; font-size: 0.85rem; margin: var(--space-3) 0 0; }
    .order-hint a { color: var(--accent); border-bottom: 1px solid var(--accent-light); }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a href="index.html" class="brand">Aura Strand</a>
      <nav class="nav">
        <a href="index.html">หน้าแรก</a>
        <a href="product.html">สินค้า</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container">
        <div class="section-title">
          <span class="eyebrow">Order</span>
          <h1>สั่งซื้อสินค้า</h1>
        </div>

        <div class="order-box">
          <form id="orderForm">
            <div class="field">
              <label for="customerName">ชื่อลูกค้า</label>
              <input type="text" id="customerName" name="customerName" required autocomplete="name">
            </div>

            <div class="field">
              <label for="contact">เบอร์โทร / Line</label>
              <input type="text" id="contact" name="contact" required autocomplete="tel">
            </div>

            <div class="field">
              <label for="items">รายการสินค้า</label>
              <input type="text" id="items" name="items" required>
            </div>

            <div class="field">
              <label for="total">จำนวนเงินรวม (บาท)</label>
              <input type="number" id="total" name="total" min="0" required>
            </div>

            <div class="field">
              <label for="note">หมายเหตุ</label>
              <textarea id="note" name="note" placeholder="เช่น ที่อยู่จัดส่ง หรือข้อความถึงร้าน"></textarea>
            </div>

            <button type="submit" class="btn btn--block">ยืนยันสั่งซื้อ</button>
          </form>

          <p class="order-hint"><a href="product.html">← เลือกสินค้าเพิ่มเติม</a></p>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span class="brand">Aura Strand</span>
      <p>© 2026 Aura Strand. All rights reserved.</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
